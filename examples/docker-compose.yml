services:
  transmission:
    image: linuxserver/transmission
    restart: always
    ports:
      - "127.0.0.1:9091:9091"
      - "51413:51413"
      - "51413:51413/udp"

  transmission-exporter:
    image: ghcr.io/spnngl/images/transmission-exporter
    restart: always
    ports:
      - "127.0.0.1:19091:19091"
    environment:
      TRANSMISSION_ADDR: http://transmission:9091

  prometheus:
    image: quay.io/prometheus/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "./prometheus:/etc/prometheus/"
